version: "3.8"
services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerly
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  cache:
    image: redis:6.2
    command: ["redis-server", "--requirepass", "r3d1s-Pr0d-9f3a7c2e5b1d4a8f"]
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - db
      - cache
    env_file: .env.local
    environment:
      DATABASE_URL: postgres://ledgerly:postgres@db:5432/ledgerly
      REDIS_URL: redis://:r3d1s-Pr0d-9f3a7c2e5b1d4a8f@cache:6379
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  dbdata:
