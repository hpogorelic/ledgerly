name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: ledgerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgerly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway test database and Redis DB index: the tests TRUNCATE and FLUSHDB.
      DATABASE_URL: postgres://ledgerly:ci-throwaway@localhost:5432/ledgerly_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
      - run: npm test
